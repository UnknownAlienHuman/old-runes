name: Service-document language boundary

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify technical English and preserved Russian localization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cyrillic = re.compile(r'[А-Яа-яЁё]')
          todo = Path('todo.md').read_text(encoding='utf-8')
          if cyrillic.search(todo):
              raise SystemExit('todo.md still contains Cyrillic service text')

          localization = Path('Localization.lua').read_text(encoding='utf-8')
          toc = Path('OldRunes.toc').read_text(encoding='utf-8')
          if not cyrillic.search(localization):
              raise SystemExit('Russian localization was unexpectedly removed')
          if 'Notes-ruRU' not in toc:
              raise SystemExit('Notes-ruRU metadata was unexpectedly removed')
          print('Language boundary: PASS')
          PY

      - name: Parse runtime Lua unchanged by the documentation contract
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          find . -maxdepth 2 -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
