name: Reconstruct source payload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download, verify, and commit sources
        shell: bash
        run: |
          set -euo pipefail
          payload=/tmp/oldrunes-large.tar.xz
          unpack=/tmp/oldrunes-payload

          curl -fL --retry 3 --retry-all-errors \
            'https://at.adobe.com/LF7AGM2njTME6ESy' \
            -o "$payload"
          echo '1d44aab49d9acfd2e136be12da11f64973e4ca87294e33c9701e8804733c8fdb  /tmp/oldrunes-large.tar.xz' | sha256sum --check -

          rm -rf "$unpack"
          mkdir -p "$unpack" tests
          tar -xJf "$payload" -C "$unpack"
          cp "$unpack/Core.lua" Core.lua
          cp "$unpack/Localization.lua" Localization.lua
          cp "$unpack/test_core.lua" tests/test_core.lua

          echo 'ea7c802bd99da9251662965814c81d2692bd9cf8924dad53befcf7024650b504  Core.lua' | sha256sum --check -
          echo '6dc6437bab28060af2b843982ae39e55594a9f4821b6245ce89d3673b93d4da6  Localization.lua' | sha256sum --check -
          echo '0c0c80c5ea426990af98ccb01e17529e5eca262e346608d01e7ec82018eda511  tests/test_core.lua' | sha256sum --check -

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Core.lua Localization.lua tests/test_core.lua
          git commit -m 'Reconstruct validated source files'
          git push origin "HEAD:${GITHUB_REF_NAME}"
