name: Validate and release addon

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: Publish or update the GitHub release after validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: old-runes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
      archive: ${{ steps.build.outputs.archive }}
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate and package
        id: build
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^## Version:[[:space:]]*//p' OldRunes.toc | head -n 1 | tr -d '\r')"
          interface="$(sed -n 's/^## Interface:[[:space:]]*//p' OldRunes.toc | head -n 1 | tr -d '\r')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$interface" == "120105" ]]

          luac5.1 -p Localization.lua Core.lua Options.lua tests/test_core.lua tests/test_options.lua

          regressions=(
            release
            reuse
            overlay_cache
            empty
            combat
            timers
            stale_prd
            inaccessible
            brightness
            combat_mixed
            database
            cooldown_unavailable
          )
          for regression in "${regressions[@]}"; do
            lua5.1 tests/test_core.lua "$regression"
          done
          lua5.1 tests/test_options.lua

          python3 - <<'PY'
          import re
          from pathlib import Path

          toc_text = Path("OldRunes.toc").read_text(encoding="utf-8")
          runtime = [
              line.strip()
              for line in toc_text.splitlines()
              if line.strip() and not line.lstrip().startswith("##")
          ]
          expected = ["Localization.lua", "Core.lua", "Options.lua"]
          if runtime != expected:
              raise SystemExit(f"unexpected TOC runtime closure: {runtime!r}")

          required_metadata = (
              "## Interface: 120105",
              "## SavedVariables: OldRunesDB",
              "## Category: Class",
              "## IconAtlas: UF-DKRunes-Blood-SkullActive",
          )
          for line in required_metadata:
              if line not in toc_text.splitlines():
                  raise SystemExit(f"missing TOC metadata: {line}")

          checked = [
              ".github/workflows/release.yml",
              "OldRunes.toc",
              *expected,
              "tests/test_core.lua",
              "tests/test_options.lua",
          ]
          for name in checked:
              data = Path(name).read_bytes()
              if data.startswith(b"\xef\xbb\xbf") or b"\r\n" in data:
                  raise SystemExit(f"invalid encoding or line endings: {name}")

          workflow = Path(".github/workflows/release.yml").read_text(encoding="utf-8")
          localization = Path("Localization.lua").read_text(encoding="utf-8")
          core = Path("Core.lua").read_text(encoding="utf-8")
          options = Path("Options.lua").read_text(encoding="utf-8")
          tests = Path("tests/test_core.lua").read_text(encoding="utf-8")

          release_invariants = (
              "github.ref == 'refs/heads/main'",
              'gh api "repos/$GITHUB_REPOSITORY/commits/$tag"',
              '[[ "$tag_commit_sha" == "$GITHUB_SHA" ]]',
          )
          for needle in release_invariants:
              if needle not in workflow:
                  raise SystemExit(f"missing release invariant: {needle}")

          gate_prefixes = {
              "Localization.lua": [
                  "-- Old Runes localization",
                  "",
                  'local _, playerClass = UnitClass("player")',
                  'if playerClass ~= "DEATHKNIGHT" then',
                  "    return",
                  "end",
              ],
              "Core.lua": [
                  "-- Old Runes (Retail 12.1.5)",
                  "-- Classic Death Knight rune art on Blizzard-owned rune frames.",
                  "",
                  'local ADDON_NAME = ... or "OldRunes"',
                  'local _, playerClass = UnitClass("player")',
                  'if playerClass ~= "DEATHKNIGHT" then',
                  "    return",
                  "end",
              ],
              "Options.lua": [
                  "-- Old Runes Settings panel",
                  "",
                  'local _, playerClass = UnitClass("player")',
                  'if playerClass ~= "DEATHKNIGHT" then',
                  "    return",
                  "end",
              ],
          }
          sources = {
              "Localization.lua": localization,
              "Core.lua": core,
              "Options.lua": options,
          }
          for name, prefix in gate_prefixes.items():
              actual = sources[name].splitlines()[:len(prefix)]
              if actual != prefix:
                  raise SystemExit(f"{name} no longer exits at the required DK gate: {actual!r}")

          forbidden = (
              r"\blayoutIndex\s*=",
              r":Layout\s*\(",
              r"UpdateRunes\s*\(\s*false",
              r"\bGet(?:Num)?Children\b",
              r"DeathKnightResourceOverlayFrame",
              r"\bprdClassFrame\b",
              r"C_Timer\.NewTicker",
              r"C_Timer\.After",
              r"\bisDeathKnight\b",
              r"API\.isDeathKnight",
              r"command\s*==\s*[\"']multicolor[\"']",
              r"command\s*==\s*[\"']reverse[\"']",
              r"local\s+runeOverlays\s*=\s*setmetatable",
          )
          for pattern in forbidden:
              if re.search(pattern, core):
                  raise SystemExit(f"forbidden runtime pattern: {pattern}")

          required_core = (
              'classFrame = prdFrame.classFrame',
              'hooksecurefunc(frame, "UpdateRunes"',
              'PLAYER_REGEN_ENABLED',
              'db.multicolorRunes = nil',
              'db.reverseRecoveryOrder = nil',
              'ForgetRuneFrame(currentPRDClassFrame)',
              'local timerIndex = i',
              'local runeOverlays = {}',
              'local MAX_RETIRED_RUNE_OVERLAYS = 12',
              'RetireRuneOverlay(rune)',
              'if type(ready) == "boolean" then',
              'if type(ready) ~= "boolean" then',
          )
          for needle in required_core:
              if needle not in core:
                  raise SystemExit(f"missing runtime invariant: {needle}")

          if "non_dk" in tests:
              raise SystemExit("irrelevant non-DK runtime scenario returned")

          required_regressions = (
              '"release"', '"reuse"', '"overlay_cache"', '"empty"',
              '"combat"', '"timers"', '"stale_prd"', '"inaccessible"',
              '"brightness"', '"combat_mixed"', '"database"',
              '"cooldown_unavailable"',
          )
          for name in required_regressions:
              if name not in tests:
                  raise SystemExit(f"missing focused regression: {name}")

          surface = localization + options
          for removed in ("OPT_REVERSE", "CMD_DESC_REVERSE", "MSG_REVERSE_REMOVED", "prdClassFrame"):
              if removed in surface:
                  raise SystemExit(f"removed user surface returned: {removed}")
          PY

          archive="OldRunes-$version.zip"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          rm -rf package "$archive"
          mkdir -p package/OldRunes
          cp OldRunes.toc Localization.lua Core.lua Options.lua package/OldRunes/
          find package -exec touch -d "@$source_date_epoch" {} +
          (
            cd package
            TZ=UTC zip -q -X -9 "../$archive" \
              OldRunes/ \
              OldRunes/OldRunes.toc \
              OldRunes/Localization.lua \
              OldRunes/Core.lua \
              OldRunes/Options.lua
          )

          actual="$(unzip -Z1 "$archive" | sort)"
          expected="$(printf '%s\n' OldRunes/ OldRunes/OldRunes.toc OldRunes/Localization.lua OldRunes/Core.lua OldRunes/Options.lua | sort)"
          [[ "$actual" == "$expected" ]]

          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          printf '### Package\n\n- `%s`\n- SHA-256: `%s`\n' "$archive" "$digest" >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Rebuild verified package
        env:
          ARCHIVE: ${{ needs.validate.outputs.archive }}
          EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          rm -rf package "$ARCHIVE"
          mkdir -p package/OldRunes
          cp OldRunes.toc Localization.lua Core.lua Options.lua package/OldRunes/
          find package -exec touch -d "@$source_date_epoch" {} +
          (
            cd package
            TZ=UTC zip -q -X -9 "../$ARCHIVE" \
              OldRunes/ \
              OldRunes/OldRunes.toc \
              OldRunes/Localization.lua \
              OldRunes/Core.lua \
              OldRunes/Options.lua
          )
          actual_sha256="$(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
          [[ "$actual_sha256" == "$EXPECTED_SHA256" ]]

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          ARCHIVE: ${{ needs.validate.outputs.archive }}
          SHA256: ${{ needs.validate.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          tag_exists=false

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            tag_exists=true
            tag_commit_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')"
            [[ "$tag_commit_sha" == "$GITHUB_SHA" ]]
          fi

          cat > release-notes.md <<EOF
          ## Old Runes $VERSION

          World of Warcraft Retail 12.1.5 (Interface \`120105\`).

          See \`CHANGELOG.md\` for the full change list.

          SHA-256: \`$SHA256\`
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ARCHIVE" --clobber
            gh release edit "$tag" --title "Old Runes $VERSION" --notes-file release-notes.md --latest
          elif [[ "$tag_exists" == true ]]; then
            gh release create "$tag" "$ARCHIVE" --title "Old Runes $VERSION" --notes-file release-notes.md --latest
          else
            gh release create "$tag" "$ARCHIVE" --target "$GITHUB_SHA" --title "Old Runes $VERSION" --notes-file release-notes.md --latest
          fi
