name: Apply reviewed payload

on:
  push:
    branches:
      - agent/modernize-12.1.5

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download, verify, and commit reviewed files
        shell: bash
        run: |
          set -euo pipefail
          payload=/tmp/oldrunes-review-payload.tar.xz
          unpack=/tmp/oldrunes-review-payload

          curl -fL --retry 3 --retry-all-errors \
            'https://at.adobe.com/v1us5u91hr4cvYPa' \
            -o "$payload"
          echo 'e03a089551a2294e7eebe118743de332b4d72a90db7e8b371bdca65663f46585  /tmp/oldrunes-review-payload.tar.xz' | sha256sum --check -

          rm -rf "$unpack"
          mkdir -p "$unpack"
          tar -xJf "$payload" -C "$unpack"
          (cd "$unpack" && sha256sum --check SHA256SUMS)

          mkdir -p tests
          cp "$unpack/Core.lua" Core.lua
          cp "$unpack/Options.lua" Options.lua
          cp "$unpack/tests/test_core.lua" tests/test_core.lua
          cp "$unpack/ARCHITECTURE.md" ARCHITECTURE.md
          cp "$unpack/AGENT_GUIDE.md" AGENT_GUIDE.md
          cp "$unpack/CHANGELOG.md" CHANGELOG.md

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Core.lua Options.lua tests/test_core.lua ARCHITECTURE.md AGENT_GUIDE.md CHANGELOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Detach replaced rune frame owners'
          git push origin "HEAD:${GITHUB_REF_NAME}"
